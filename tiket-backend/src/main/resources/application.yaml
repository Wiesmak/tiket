spring:
  application:
    name: tiket-backend
  main:
    web-application-type: servlet
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 25s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  grpc:
    server:
      address: ${GRPC_ADDRESS:127.0.0.1}
      port: ${GRPC_PORT:9090}
      servlet:
        enabled: false
      reflection:
        enabled: false
      inbound:
        message:
          max-size: ${GRPC_MAX_MESSAGE:1MB}
        metadata:
          max-size: 8KB
      shutdown:
        grace-period: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tiket?connectTimeout=5&socketTimeout=30}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      initialization-fail-timeout: 5000
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    validate-on-migrate: true
server:
  port: -1
  shutdown: graceful
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,grpc
logging:
  structured:
    json:
      add:
        service: ${spring.application.name}
        environment: ${TIKET_ENVIRONMENT:unspecified}
    format:
      console: logstash
tiket:
  security:
    issuer: ${JWT_ISSUER:}
    jwks: ${JWT_JWKS_URI:}
    audience: ${JWT_AUDIENCE:}
