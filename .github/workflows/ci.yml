name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
      - run: chmod +x gradlew && ./gradlew clean build --no-configuration-cache --no-build-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - run: bash scripts/install-ci-tools.sh
      - run: npm ci --prefix scripts
      - run: npm audit --prefix scripts --audit-level=high
      - run: node scripts/validate-helm.mjs
      - run: docker build -t tiket:kind .
      - run: bash scripts/container-smoke.sh
      - id: kind
        run: node scripts/test-kind.mjs
      - name: Remove only this invocation's cluster
        if: always() && steps.kind.outputs.cluster != ''
        run: kind delete cluster --name "${{ steps.kind.outputs.cluster }}"
      - name: Image vulnerability gate
        run: |
          mkdir -p build/supply-chain
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/supply-chain:/out" aquasec/trivy:0.67.2 image --scanners vuln --severity HIGH,CRITICAL --format json --output /out/vulnerabilities.json --exit-code 1 tiket:kind
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-evidence
          path: |
            build/kind-*
            **/build/reports/tests/
            build/java-version.log
            build/supply-chain/
