name: Documentation
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.9'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - name: Install locked documentation tooling
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install --require-hashes -r requirements-docs.txt
          .venv-docs/bin/python scripts/docs.py install-tools
          npm ci --prefix scripts
      - name: Generate API documentation
        run: |
          chmod +x gradlew
          bash scripts/ci-gradle.sh :tiket-contracts:generateProto :dokkaGenerate
          .venv-docs/bin/python scripts/docs.py proto --check
      - name: Validate and assemble static site
        run: |
          node scripts/validate-doc-examples.mjs
          .venv-docs/bin/python scripts/validate-docs.py
          .venv-docs/bin/mkdocs build --strict
          .venv-docs/bin/python scripts/docs.py assemble
          .venv-docs/bin/python scripts/validate-docs.py --site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-site
          path: site/
          retention-days: 14
